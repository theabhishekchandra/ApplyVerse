<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Finder — Search all</title>
  <link rel="icon" type="image/png" href="icons/icon48.png">
  <link rel="stylesheet" href="results.css">
</head>
<body>
  <div class="app">
    <!-- ==================== SIDEBAR ==================== -->
    <aside class="rail">
      <div class="rail-head">
        <img class="logo" src="icons/icon48.png" alt="Logo">
        <div>
          <div class="brand">Job Finder</div>
          <div class="sub">search every board at once</div>
        </div>
      </div>

      <div class="rail-scroll">
        <div class="group">
          <div class="fld"><label>Role / profile</label><input id="role" type="text" placeholder="android developer"></div>
          <div class="fld"><label>Location</label><input id="loc" type="text" placeholder="India"></div>
          <div class="fld"><label>Keywords <span class="hint">any match</span></label><input id="keywords" type="text" placeholder="android, kotlin, flutter"></div>
          <div class="fld"><label>Exclude</label><input id="exclude" type="text" placeholder="senior, sales"></div>
        </div>

        <div class="group">
          <div class="group-head">
            <span class="group-title">Providers</span>
            <span class="group-tools">
              <label class="mini-chk"><input type="checkbox" id="selAll"> all</label>
              <button id="recheck" class="linkbtn">↻ logins</button>
            </span>
          </div>
          <div id="providers" class="providers"></div>
        </div>

        <div class="group">
          <div class="group-head">
            <span class="group-title">Company ATS · direct</span>
            <span class="group-tools">
              <button id="dork" class="linkbtn">⚡ Dork builder</button>
            </span>
          </div>
          <div class="ats-note">Sweeps curated companies' public career APIs — no login, no tabs.</div>
          <div id="atsProviders" class="providers"></div>
        </div>
      </div>

      <div class="rail-foot">
        <button id="search" class="primary block">▶ Search selected</button>
        <div id="status" class="status"></div>
      </div>
    </aside>

    <!-- ==================== CONTENT ==================== -->
    <main class="content">
      <div class="topbar">
        <div class="topbar-row">
          <h1>Results <span id="count" class="count"></span></h1>
          <div class="topbar-actions">
            <label class="mini-chk"><input type="checkbox" id="onlyNew"> only new</label>
            <button id="csv" class="ghost" disabled>⬇ Export CSV</button>
          </div>
        </div>

        <div id="toolbar" class="toolbar" hidden>
          <input id="fText" type="text" class="search-in" placeholder="Filter title / company…">
          <label class="sel">Experience
            <select id="fExp"><option value="any">Any</option><option value="fresher">Fresher 0–1</option><option value="junior">Junior 1–3</option><option value="mid">Mid 3–6</option><option value="senior">Senior 6+</option></select>
          </label>
          <label class="sel">Freshness
            <select id="fFresh"><option value="0">Any time</option><option value="1">24 hours</option><option value="3">3 days</option><option value="7">This week</option><option value="30">This month</option></select>
          </label>
          <label class="sel">Mode
            <select id="fMode"><option value="any">Any</option><option value="remote">Remote</option><option value="hybrid">Hybrid</option><option value="onsite">On-site</option></select>
          </label>
          <label class="sel">Sort
            <select id="fSort"><option value="newfirst">New first</option><option value="newest">Newest</option><option value="company">Company</option><option value="title">Title</option><option value="salary">Salary</option></select>
          </label>
          <span id="showing" class="showing"></span>
          <div id="srcChips" class="src-chips"></div>
        </div>
      </div>

      <div id="rows" class="cards"></div>
      <div id="empty" class="empty">
        <img class="empty-img" src="icons/empty_state.png" alt="Empty State">
        <p>Pick your providers and hit <b>Search selected</b>.<br>Results from every board land here, de-duplicated.</p>
      </div>
    </main>
  </div>

  <script src="sites.js"></script>
  <script src="ats.js"></script>
  <script src="results.js"></script>
</body>
</html>
