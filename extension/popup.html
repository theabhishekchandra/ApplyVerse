<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="brand-logo" src="icons/icon48.png" alt="Logo">
    <span class="brand">ApplyVerse</span>
    <span id="count" class="count"></span>
  </header>

  <div class="body">
    <button id="openAll" class="primary" style="width:100%">🔎 Search ALL providers →</button>
    <a id="settings" class="settings-link" href="#">⚙ Automation &amp; settings — let it watch for new jobs</a>
    <div id="singleHint" class="note" hidden>Open one of the 12 job sites in this tab to also run just that provider here.</div>

    <div id="single" hidden>
      <label class="lbl" style="margin-top:10px">Or run this one site</label>
      <select id="site"></select>
      <div id="note" class="note"></div>
      <div id="warn" class="warn" hidden></div>

      <div id="form"></div>

      <div class="opts">
        <label class="chk"><input type="checkbox" id="onlyNew"> Only new since last run</label>
        <label class="chk"><input type="checkbox" id="openTabs"> Open matches in new tabs</label>
      </div>

      <div class="row">
        <button id="start" class="primary">▶ Start</button>
        <button id="stop" class="ghost" hidden>■ Stop</button>
        <button id="csv" class="ghost" disabled>⬇ CSV</button>
      </div>

      <div id="status" class="status"></div>
      <div id="list" class="list"></div>
    </div>
  </div>

  <script src="rank.js"></script>
  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
